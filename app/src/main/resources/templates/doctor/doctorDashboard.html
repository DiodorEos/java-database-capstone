<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Doctor Dashboard | SmartCare</title>
<link rel="icon" th:href="@{/assets/images/logo/logo.png}">
<link rel="stylesheet" th:href="@{/assets/css/style.css}"><link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
<script th:src="@{/js/util.js}" defer></script><script th:src="@{/js/render.js}" defer></script>
<script th:src="@{/js/components/header.js}" defer></script><script th:src="@{/js/components/footer.js}" defer></script>
<script type="module" th:src="@{/js/doctorDashboard.js}"></script>
</head>
<body data-page="doctor"><a class="skip-link" href="#main">Skip to content</a><div class="container"><div class="wrapper"><div id="header"></div>
<main id="main" class="main-content"><div class="page-heading"><p class="eyebrow">DOCTOR WORKSPACE</p><h1>Your day, at a glance.</h1><p>Review appointments and open the patient record before a consultation.</p></div><section class="filter-wrapper" aria-label="Filter appointments"><label class="search-label" for="searchBar">Patient name<input id="searchBar" type="search" placeholder="Search by patient name"></label><label for="datePicker">Appointment date<input id="datePicker" type="date" required></label><button id="todayButton" type="button" class="secondary">Today's Appointments</button></section><div class="results-heading"><h2>Appointments</h2><span id="resultCount" aria-live="polite"></span></div><div class="table-scroll"><table id="patientTable"><caption class="sr-only">Appointments for the selected date</caption><thead><tr><th scope="col">Patient ID</th><th scope="col">Name</th><th scope="col">Phone</th><th scope="col">Email</th><th scope="col">Date &amp; time</th><th scope="col">Status</th><th scope="col">Prescription</th></tr></thead><tbody id="patientTableBody" aria-live="polite"></tbody></table></div></main><div id="footer"></div></div></div><div id="modal" class="modal" hidden><section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button type="button" id="closeModal" class="close" aria-label="Close dialog">×</button><div id="modal-body"></div></section></div></body></html>
