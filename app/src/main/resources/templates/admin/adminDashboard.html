<body data-page="admin"><a class="skip-link" href="#main">Skip to content</a><div class="container"><div class="wrapper"><div id="header"></div>
<main id="main" class="main-content"><div class="page-heading"><p class="eyebrow">CLINIC ADMINISTRATION</p><h1>Your care team.</h1><p>Find, add, and manage the doctors in your clinic.</p></div><section class="filter-wrapper" aria-label="Find a doctor"><label class="search-label" for="searchBar">Doctor name<input type="search" id="searchBar" placeholder="Search by doctor name"></label><label for="filterTime">Consultation time<select id="filterTime"><option value="">Any time</option><option value="AM">Morning (AM)</option><option value="PM">Afternoon (PM)</option></select></label><label for="filterSpecialty">Specialty<select id="filterSpecialty"><option value="">All specialties</option><option value="Cardiologist">Cardiologist</option><option value="Dermatologist">Dermatologist</option><option value="Neurologist">Neurologist</option><option value="Pediatrician">Pediatrician</option><option value="Orthopedist">Orthopedist</option><option value="Gynecologist">Gynecologist</option><option value="Psychiatrist">Psychiatrist</option><option value="Dentist">Dentist</option><option value="Ophthalmologist">Ophthalmologist</option><option value="ENT Specialist">ENT Specialist</option><option value="Urologist">Urologist</option><option value="Oncologist">Oncologist</option><option value="Gastroenterologist">Gastroenterologist</option><option value="General Physician">General Physician</option></select></label></section><div class="results-heading"><h2>Our doctors</h2><span id="resultCount" aria-live="polite"></span></div><p id="pageStatus" role="status"></p><section id="content" class="doctor-grid" aria-label="Doctor directory" aria-live="polite"><p class="empty-state">Loading doctors…</p></section></main><div id="footer"></div></div></div><div id="modal" class="modal" hidden><section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button type="button" id="closeModal" class="close" aria-label="Close dialog">×</button><div id="modal-body"></div></section></div></body></html>
