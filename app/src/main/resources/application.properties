spring.application.name=back-end

# Supply environment-specific connections and secrets outside version control.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/cms?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${MYSQL_USER:cms_app}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.mongodb.uri=${MONGODB_URI}

management.endpoint.health.show-details=never
management.health.db.enabled=true
api.path=/
jwt.secret=${JWT_SECRET}

spring.web.resources.static-locations=classpath:/static/
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
