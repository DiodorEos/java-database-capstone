<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Welcome | SmartCare</title>
    <link rel="icon" href="./assets/images/logo/logo.png">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/index.css">
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
    <script type="module" src="./js/services/index.js"></script>
</head>

<body data-page="home"><a class="skip-link" href="#main">Skip to content</a>
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>
            <main id="main" class="main-content">
                <section class="hero">
                    <p class="eyebrow">YOUR CLINIC, CONNECTED</p>
                    <h1>Good care starts<br>with a simpler day.</h1>
                    <p class="hero-copy">Appointments, people, and care — together in one place.</p>
                    <h2>Select Your Role</h2>
                    <div class="role-grid"><button id="adminLogin" class="role-card"><span class="role-icon"
                                aria-hidden="true">01</span><strong>Admin</strong><span>Manage your clinic's doctor
                                directory.</span><span class="role-link">Admin login →</span></button><button
                            id="doctorLogin" class="role-card"><span class="role-icon"
                                aria-hidden="true">02</span><strong>Doctor</strong><span>See your schedule and patient
                                records.</span><span class="role-link">Doctor login →</span></button><button
                            id="patientRole" class="role-card"><span class="role-icon"
                                aria-hidden="true">03</span><strong>Patient</strong><span>Find a doctor and plan your
                                next visit.</span><span class="role-link">Explore doctors →</span></button></div>
                </section>
            </main>
            <div id="footer"></div>
        </div>
    </div>
    <div id="modal" class="modal" hidden>
        <section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button
                type="button" id="closeModal" class="close" aria-label="Close dialog">×</button>
            <div id="modal-body"></div>
        </section>
    </div>
</body>

</html>
